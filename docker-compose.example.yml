# tractive-mqtt-bridge — example deployment
#
# Copy this to docker-compose.yml and .env.example to .env, fill in .env,
# then `docker compose up -d --build`.
#
# The image is published as ghcr.io/geoffmyers/tractive-mqtt-bridge (`docker compose pull`),
# or build it here (`docker compose build`). The build
# vendors the shared HA-discovery/MQTT toolkit from ./_shared — see
# ARCHITECTURE.md. Requires Docker Compose v2.17+ (for `additional_contexts`).
services:
  tractive-mqtt-bridge:
    build:
      context: .
      additional_contexts:
        ha_mqtt_bridge: ./_shared/ha-mqtt-bridge-toolkit
        python_github_error_reporter: ./_shared/python-github-error-reporter
    image: ghcr.io/geoffmyers/tractive-mqtt-bridge:latest
    container_name: tractive-mqtt-bridge
    hostname: tractive-mqtt-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      TRACTIVE_USERNAME: ${TRACTIVE_USERNAME}
      TRACTIVE_PASSWORD: ${TRACTIVE_PASSWORD}
      TRACTIVE_CLIENT_ID: ${TRACTIVE_CLIENT_ID:-625e533dc3c3b41c28a669f0}
      TRACTIVE_USER_ID: ${TRACTIVE_USER_ID}
      MQTT_HOST: ${MQTT_HOST:-mqtt.example.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS: ${MQTT_TLS:-0}
      MQTT_CA_FILE: ${MQTT_CA_FILE:-}
      FAST_POLL_INTERVAL: ${FAST_POLL_INTERVAL:-90}
      MED_POLL_INTERVAL: ${MED_POLL_INTERVAL:-300}
      SLOW_POLL_INTERVAL: ${SLOW_POLL_INTERVAL:-3600}
      INTER_CALL_DELAY: ${INTER_CALL_DELAY:-0.4}
      POSITION_BACKFILL_HOURS: ${POSITION_BACKFILL_HOURS:-24}
      EVENT_BACKFILL_DAYS: ${EVENT_BACKFILL_DAYS:-30}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-UTC}
      CHANNEL_ENABLED: ${CHANNEL_ENABLED:-1}
      HA_DISCOVERY_PREFIX: ${HA_DISCOVERY_PREFIX:-homeassistant}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-tractive}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional production-error reporting — off unless both are set.
      GITHUB_ERROR_TOKEN: ${GITHUB_ERROR_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_ERROR_ENVIRONMENT: ${GITHUB_ERROR_ENVIRONMENT:-production}
    # ThreadedPublisher (toolkit) touches /tmp/healthy on every publish. With
    # a 90s poll plus a long-lived real-time channel, a fresh mtime within
    # 600s means the bridge is alive and making progress on at least one
    # source.
    healthcheck:
      test:
        - CMD-SHELL
        - 'mtime=$$(stat -c %Y /tmp/healthy 2>/dev/null) && [ "$$(( $$(date +%s) - mtime ))" -lt 600 ]'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Application code bind-mounted (not baked into the image) so a code
      # change needs only a restart, not a rebuild. Read-only.
      - ./app:/app:ro
